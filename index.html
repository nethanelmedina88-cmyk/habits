<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>מעקב הרגלים</title>
<meta name="description" content="מעקב הרגלים אישי עם שמירה בענן">
<meta name="theme-color" content="#0B0D1A">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הרגלים">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="heebo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar">
    <div class="topbar-text">
      <div class="hello" id="hello">שלום</div>
      <div class="topbar-sub">
        <span class="today-label" id="todayLabel"></span>
        <span class="top-progress" id="topProgress" aria-hidden="true"></span>
      </div>
    </div>
    <button class="sync-chip" id="syncChip" data-action="open-settings" aria-label="סנכרון והגדרות">
      <span class="sync-dot"></span><span class="sync-text">נשמר במכשיר</span>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>
</div>

<nav class="tabbar" id="tabbar" aria-label="ניווט ראשי">
  <button class="tab" data-tab="today" aria-label="היום">
    <span class="tab-ind"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/></svg></span>
    <span>היום</span>
  </button>
  <button class="tab" data-tab="month" aria-label="חודש">
    <span class="tab-ind"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg></span>
    <span>חודש</span>
  </button>
  <button class="tab" data-tab="stats" aria-label="ניתוח">
    <span class="tab-ind"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
    <span>ניתוח</span>
  </button>
  <button class="tab" data-tab="habits" aria-label="ההרגלים שלי">
    <span class="tab-ind"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg></span>
    <span>הרגלים</span>
  </button>
</nav>

<div class="sheet-backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head">
    <div class="sheet-grip" aria-hidden="true"></div>
    <button class="icon-btn sheet-close" data-action="close-sheet" aria-label="סגירה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div class="ctx" id="ctx" hidden>
  <div class="ctx-backdrop" data-action="ctx-close"></div>
  <div class="ctx-card" id="ctxCard" aria-hidden="true"></div>
  <div class="ctx-menu" id="ctxMenu" role="menu"></div>
</div>

<div class="coach" id="coach" hidden>
  <div class="coach-spot" id="coachSpot"></div>
  <div class="coach-pop" id="coachPop" role="dialog" aria-labelledby="coachTitle"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="app.js"></script>
</body>
</html>
